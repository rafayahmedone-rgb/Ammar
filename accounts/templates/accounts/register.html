{% extends "base.html" %}

{% block title %}Register | Southern Cross Auctions{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="h3 mb-3">Create an account</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p class="mt-3">
            Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
