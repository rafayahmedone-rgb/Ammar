{% extends "base.html" %}

{% block title %}Log in | Southern Cross Auctions{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="h3 mb-3">Log in</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            {# "next" sends the user back to the page they were trying to open. #}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>
        <p class="mt-3">
            New here? <a href="{% url 'accounts:register' %}">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
